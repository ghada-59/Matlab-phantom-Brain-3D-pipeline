<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><title>OsteoMorph3D processing workflow</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#faf7f0"/><stop offset="1" stop-color="#e9f0eb"/></linearGradient><linearGradient id="deep" x2="1" y2="1"><stop stop-color="#193d43"/><stop offset="1" stop-color="#2e6c6c"/></linearGradient></defs><rect width="1400" height="650" rx="28" fill="url(#bg)"/><text x="55" y="62" font-family="Arial" font-size="16" font-weight="bold" letter-spacing="4" fill="#b75c42">METHOD / PROCESS MAP</text><text x="55" y="108" font-family="Arial" font-size="34" font-weight="bold" fill="#193d43">A phantom-first morphometry pipeline</text><g font-family="Arial"><g fill="#fffdf8" stroke="#d8e1da" stroke-width="2"><rect x="55" y="165" width="370" height="155" rx="18"/><rect x="515" y="165" width="370" height="155" rx="18"/><rect x="975" y="165" width="370" height="155" rx="18"/><rect x="55" y="405" width="370" height="155" rx="18"/><rect x="515" y="405" width="370" height="155" rx="18"/></g><rect x="975" y="405" width="370" height="155" rx="18" fill="url(#deep)"/><g fill="#b75c42" font-size="14" font-weight="bold" letter-spacing="2"><text x="82" y="202">01 / INPUT</text><text x="542" y="202">02 / CALIBRATION</text><text x="1002" y="202">03 / SEGMENTATION</text><text x="82" y="442">04 / MORPHOMETRY</text><text x="542" y="442">05 / VALIDATION</text><text x="1002" y="442" fill="#a9d6c9">06 / OUTPUT</text></g><g fill="#193d43" font-size="22" font-weight="bold"><text x="82" y="244">Phantom or DICOM</text><text x="542" y="244">HU + voxel geometry</text><text x="1002" y="244">3D bone mask</text><text x="82" y="484">Surface + measurements</text><text x="542" y="484">Reference comparisons</text></g><g fill="#5b706b" font-size="15"><text x="82" y="275">Synthetic ellipsoid / optional CT series</text><text x="542" y="275">Slope + intercept; [sy, sx, sz] mm</text><text x="1002" y="275">Otsu or fixed HU threshold + cleanup</text><text x="82" y="515">Voxel volume, mesh area/volume, axes</text><text x="542" y="515">Voxel size, noise and rotation sweeps</text></g><g fill="#fff5df" font-size="15"><text x="1002" y="515">JSON · CSV · STL · PNG · React viewer</text></g></g><g fill="none" stroke="#b75c42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M425 242 H498 M488 232 L498 242 L488 252"/><path d="M885 242 H958 M948 232 L958 242 L948 252"/><path d="M1160 320 V366 H240 V395 M230 385 L240 395 L250 385"/><path d="M425 482 H498 M488 472 L498 482 L488 492"/><path d="M885 482 H958 M948 472 L958 482 L948 492"/></g><rect x="55" y="590" width="1290" height="38" rx="10" fill="#e1eae3"/><text x="75" y="615" font-family="Arial" font-size="14" fill="#506b65">Reference rule: analytical ground truth is available for synthetic phantoms only; real DICOM requires an independent reference.</text></svg>