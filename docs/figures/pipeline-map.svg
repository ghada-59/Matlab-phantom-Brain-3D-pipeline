<g fill="#637970" font-size="17"><text x="110" y="555">Apply slope / intercept once.</text><text x="110" y="584">Resolve [sy, sx, sz] in mm.</text><text x="615" y="555">Physical-unit smoothing.</text><text x="615" y="584">Otsu / fixed HU + morphology.</text><text x="1120" y="555">Isosurface in millimetres.</text><text x="1120" y="584">Triangle area + mesh volume.</text><text x="110" y="835">Voxel volume · mesh volume · area.</text><text x="110" y="864">Semi-axes · solidity · sphericity.</text><text x="615" y="835">Resolution · noise · rotation sweeps.</text><text x="615" y="864">Errors only where truth is known.</text></g>
