<g fill="#b45e45" font-size="15" font-weight="700" letter-spacing="2"><text x="110" y="475">01 / CALIBRATE</text><text x="615" y="475">02 / SEGMENT</text><text x="1120" y="475">03 / RECONSTRUCT</text><text x="110" y="755">04 / MEASURE</text><text x="615" y="755">05 / VALIDATE</text><text x="1120" y="755" fill="#a9d6c9">06 / EXPORT + REVIEW</text></g>
