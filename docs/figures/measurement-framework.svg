<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><title>OsteoMorph3D measurement framework</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#faf7f0"/><stop offset="1" stop-color="#e8efeb"/></linearGradient></defs><rect width="1400" height="600" rx="28" fill="url(#bg)"/><text x="55" y="64" font-family="Arial" font-size="16" font-weight="bold" letter-spacing="4" fill="#b75c42">QUANTITATIVE MODEL</text><text x="55" y="110" font-family="Arial" font-size="34" font-weight="bold" fill="#193d43">Three volume views, one known reference</text><g fill="#fffdf8" stroke="#d9e2dc" stroke-width="2"><rect x="55" y="160" width="390" height="200" rx="20"/><rect x="505" y="160" width="390" height="200" rx="20"/><rect x="955" y="160" width="390" height="200" rx="20"/></g><g font-family="Arial"><g fill="#b75c42" font-size="14" font-weight="bold" letter-spacing="2"><text x="85" y="202">A / ANALYTIC REFERENCE</text><text x="535" y="202">B / VOXEL COUNT</text><text x="985" y="202">C / SURFACE MESH</text></g><g fill="#193d43" font-family="Georgia" font-size="31"><text x="85" y="265">4/3 πabc</text><text x="535" y="265">N × sy × sx × sz</text><text x="985" y="265">Isosurface</text></g><g fill="#536d68" font-size="15"><text x="85" y="310">Exact ellipsoid formula</text><text x="85" y="336">Synthetic phantom reference</text><text x="535" y="310">Physical voxel volume</text><text x="535" y="336">N = foreground voxel count</text><text x="985" y="310">Triangle area + divergence volume</text><text x="985" y="336">Mesh coordinates in millimetres</text></g></g><rect x="55" y="400" width="1290" height="145" rx="20" fill="#193d43"/><g font-family="Arial" fill="#fff5df"><text x="85" y="440" font-size="14" font-weight="bold" letter-spacing="2" fill="#a9d6c9">ADDITIONAL SHAPE DESCRIPTORS</text><text x="85" y="490" font-size="21" font-weight="bold">Surface area</text><text x="390" y="490" font-size="21" font-weight="bold">Semi-axes</text><text x="690" y="490" font-size="21" font-weight="bold">Sphericity</text><text x="990" y="490" font-size="21" font-weight="bold">Relative error</text><g fill="#ccddd5" font-size="14"><text x="85" y="520">Triangle sum</text><text x="390" y="520">Covariance eigenvalues</text><text x="690" y="520">Volume-to-area descriptor</text><text x="990" y="520">Only with a reference</text></g></g><text x="58" y="580" font-family="Arial" font-size="13" font-weight="bold" fill="#71817b">METHOD DIAGRAM ONLY · NO MEASURED VALUES OR ACCURACY CLAIMS</text></svg>